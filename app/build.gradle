plugins {
    id 'com.android.application'
}

android {
    namespace 'de.werks11.app'
    compileSdk 34

    defaultConfig {
        applicationId "de.werks11.app"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    // Feste Unterschrift, damit sich Updates über die alte Version installieren lassen
    signingConfigs {
        debug {
            storeFile file('werks11.keystore')
            storePassword 'werks11elf'
            keyAlias 'werks11'
            keyPassword 'werks11elf'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
