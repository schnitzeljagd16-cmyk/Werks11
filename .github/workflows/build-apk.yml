name: APK bauen

on:
  push:
    paths-ignore:
      - 'tools/probe_sites.py'
      - '.github/workflows/probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Puzzle-Fotos fest einbauen
        run: python3 tools/fetch_puzzle_pics.py || true

      - name: APK bauen
        run: gradle assembleDebug --no-daemon

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk Werks11.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Werks11-APK
          path: Werks11.apk

      - name: Version lesen
        id: ver
        run: |
          echo "name=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)" >> "$GITHUB_OUTPUT"
          echo "code=$(grep -oP 'versionCode \K[0-9]+' app/build.gradle)" >> "$GITHUB_OUTPUT"

      # Öffentliche Veröffentlichung: die App findet hier neue Versionen und installiert sie selbst
      - name: Veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Werks11 ${{ steps.ver.outputs.name }}
          body: |
            Neue Version von Werks11.
            versionCode=${{ steps.ver.outputs.code }}
          files: Werks11.apk
          make_latest: true
          overwrite_files: true
